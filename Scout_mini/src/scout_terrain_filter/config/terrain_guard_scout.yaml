grid:
  resolution: 0.15
  min_x: -5.0
  max_x: 5.0
  min_y: -4.0
  max_y: 4.0
  neighbor_radius_cells: 2
  reference_radius_cells: 3

vehicle:
  # Livox is 0.25 m ahead of base_link and the front edge is x=0.37 m, so
  # 0.12 m is the front-direction bumper reference. This is a radial gate;
  # validate side/rear self returns and add a measured crop if needed.
  min_horizontal_range: 0.12
  max_horizontal_range: 5.0
  max_traversable_slope_deg: 22.0
  max_step_height: 0.08

surface:
  min_points_per_cell: 1
  min_plane_cells: 4
  min_step_neighbors: 2
  max_vertical_span: 0.12
  max_plane_rmse: 0.05
  # The measured 0.15 m wheel diameter gives a 0.075 m radius; 0.08 m is the
  # formal relative-obstacle threshold for Scout Mini.
  obstacle_min_relative_height: 0.08
  obstacle_max_relative_height: 1.50
  # terrain_sensor is 0.48 m above the floor.  -0.42 m therefore preserves a
  # conservative ~0.06 m absolute fallback when a local ground fit is absent;
  # the formal relative-obstacle threshold remains 0.08 m when ground exists.
  unknown_absolute_min_z: -0.42
  unknown_absolute_max_z: 1.50

output:
  marking_z: 0.20
  # Jetson normal operation publishes only obstacle/clearing/diagnostics.
  publish_debug_clouds: false
  metrics_csv: ""
