# Rebuild terrain directly from the final Bayesian static point cloud. The
# conservative PMF pass supplies sparse, ceiling-safe seeds; it is not the final
# ground classifier. Local robust planes grow those seeds across continuous
# slopes and rebuild obstacles by height relative to the fitted surface.
cell_size: 0.05
candidate_percentile: 0.05

# PMF uses a large window to avoid selecting the indoor ceiling. Long slopes
# rejected by PMF are recovered by the local plane-growth stage below.
pmf/max_window_size: 101
pmf/slope: 0.40
pmf/initial_distance_m: 0.04
pmf/max_distance_m: 0.18
pmf/base: 2.0
pmf/exponential: true

# base_link starts at the mapping origin. Scout's measured Livox centre height
# is 0.48 m and its gravity-aligned sensor offset is 0.20 m, so base_link is
# 0.28 m above the floor. finalize_map.py still overrides this from geometry.
seed_x: 0.0
seed_y: 0.0
seed_ground_z: -0.28
seed_radius_m: 1.0
seed_height_tolerance_m: 0.12
trusted_seed_height_tolerance_m: 0.08
# PMF low-surface cells are distributed terrain supports and are no longer
# compared with one fixed global Z. This preserves long ramps and descents.

# Reject narrow wall/edge chains before region growth. A candidate must agree
# with a two-dimensionally supported local plane, not only with a neighbor's Z.
validation_radius_m: 0.30
validation_min_candidates: 8
plane_inlier_tolerance_m: 0.05
plane_min_inlier_ratio: 0.55
plane_min_spread_m: 0.04
candidate_plane_tolerance_m: 0.05
plane_max_rmse_m: 0.035

# Recover continuous ramps while refusing steps and disconnected layers.
max_ground_slope_deg: 25.0
connect_radius_m: 0.25
connection_plane_tolerance_m: 0.05
connection_max_normal_delta_deg: 20.0
max_ground_step_m: 0.015
min_connected_ground_cells: 100

# Fit the final dense surface only where the source cloud has nearby XY
# evidence. This closes LiDAR sampling holes without declaring unseen space free.
surface_fit_radius_m: 0.80
surface_observation_radius_m: 0.15
# Fill only internal sampling gaps with connected support on opposite sides.
# One-sided unobserved boundaries, drop-offs and room exteriors stay unknown.
surface_gap_fill_radius_m: 0.30
surface_min_candidates: 4
# Keep multiple large floor regions when sparse scans split a real ramp, while
# rejecting small disconnected PMF islands (ceilings, ledges and reflections).
surface_min_component_cells: 100
surface_min_component_fraction: 0.03

# Re-extract obstacles from the same Bayesian static source relative to ground.
# Scout's measured 0.15 m wheel diameter sets the formal threshold to 0.08 m.
min_obstacle_relative_height_m: 0.08
max_obstacle_relative_height_m: 1.50

# Downstream PGM and 2.5D builders may reference nearby surface cells.
ground_reference_radius_m: 0.35
