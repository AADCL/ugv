# State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
frequency: 20.0
sensor_timeout: 0.25
two_d_mode: false
publish_tf: false
publish_acceleration: false
print_diagnostics: true
reset_on_time_jump: false
predict_to_current_time: false
smooth_lagged_data: true
history_length: 1.0
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom
transform_timeout: 0.0

# Existing TF adapter supplies the rigid-body and world-frame transformation.
# Do not fuse its fabricated zero twist, or the same IMU a second time.
odom0: /scout/fusion/lio_input
odom0_config: [true, true, true, true, true, true,
               false, false, false, false, false, false, false, false, false]
odom0_differential: false
odom0_relative: false
odom0_queue_size: 10
odom0_nodelay: true

# Wheel pose may reset to zero at any driver restart. Use only body-forward speed.
odom1: /scout/fusion/wheel_input
odom1_config: [false, false, false, false, false, false,
               true, false, false, false, false, false, false, false, false]
odom1_differential: false
odom1_relative: false
odom1_queue_size: 20
odom1_nodelay: true
