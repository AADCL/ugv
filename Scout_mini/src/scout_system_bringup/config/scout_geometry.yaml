# Scout Mini 机器人/地图坐标配置
# 本文件是 odom -> camera_init 的唯一真值源。
# 不要在其他 launch、脚本或 pcl_transform 命令中再次手写这些数值。

odom_to_camera_init:
  x: 0.25
  y: 0.00
  # Rigid Livox-to-base_link height offset. This is not the measured 0.48 m
  # sensor height above the ground in patchworkpp_scout.yaml.
  z: 0.20

  roll_deg: 0.0
  pitch_deg: 45.0
  yaw_deg: 0.0

# Measured Livox centre height is 0.48 m. With the gravity-aligned rigid
# base_link -> terrain_sensor Z offset of 0.20 m, base_link is 0.28 m above the
# floor. Offline terrain reconstruction uses this value for its start seed;
# it must not infer ground height from the rigid sensor offset alone.
base_link_height_above_ground: 0.28
