base_global_planner: global_planner/GlobalPlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS

planner_frequency: 1.0
planner_patience: 5.0
controller_frequency: 10.0
controller_patience: 5.0
# Keep the already validated Scout navigation behavior unchanged. The guarded
# reverse plugin is installed and configured below, but must be enabled only
# after a stationary rear-coverage test on the real vehicle.
recovery_behavior_enabled: false
clearing_rotation_allowed: false
recovery_behaviors:
  - {name: start_escape_recovery, type: "scout_2p5d_navigation/StartEscapeRecovery"}

start_escape_recovery:
  cmd_vel_topic: cmd_vel
  backward_speed: 0.05
  escape_distance: 0.30
  lookahead_distance: 0.10
  sample_step: 0.025
  control_frequency: 20.0
  max_duration: 8.0
  minimum_progress: 0.12
  # Stop early if the chassis is commanded backward but does not move.
  stall_timeout: 1.5
  stall_progress: 0.02
  # Scout's Mid-360 is 0.25 m ahead of base_link. These X limits are expressed
  # in terrain_sensor, covering approximately base_link X=-0.80..-0.30 m.
  # Reverse remains inhibited unless this whole rear corridor has fresh returns.
  rear_cloud_topic: /cloud_registered_terrain
  rear_cloud_frame: terrain_sensor
  require_rear_observation: true
  rear_min_x: -1.05
  rear_max_x: -0.55
  rear_half_width: 0.36
  rear_min_points: 20
  rear_min_x_span: 0.20
  rear_min_points_per_side: 5
  rear_observation_timeout: 0.25
oscillation_timeout: 20.0
oscillation_distance: 0.05
shutdown_costmaps: false
