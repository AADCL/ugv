global_frame: odom
robot_base_frame: base_link
update_frequency: 8.0
publish_frequency: 4.0
transform_tolerance: 0.5
rolling_window: true
width: 6.0
height: 6.0
resolution: 0.05

plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  enabled: true
  footprint_clearing_enabled: true
  observation_sources: elevation_marking elevation_clearing

  elevation_marking:
    topic: /terrain/elevation_obstacle_points
    sensor_frame: terrain_sensor
    data_type: PointCloud2
    marking: true
    clearing: false
    min_obstacle_height: 0.05
    max_obstacle_height: 1.50
    obstacle_range: 4.0
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.20

  elevation_clearing:
    topic: /terrain/elevation_clearing_points
    sensor_frame: terrain_sensor
    data_type: PointCloud2
    marking: false
    clearing: true
    min_obstacle_height: -0.50
    max_obstacle_height: 2.00
    obstacle_range: 4.0
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.20

inflation_layer:
  inflation_radius: 0.10
  cost_scaling_factor: 5.0
