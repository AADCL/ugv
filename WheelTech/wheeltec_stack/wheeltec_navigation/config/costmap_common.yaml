# WheelTech four-wheel differential footprint
# 用户实测底盘尺寸：500 mm x 400 mm。
# base_link 位于车体几何中心，坐标约定为前左上。

footprint:
  - [ 0.250,  0.200]
  - [ 0.250, -0.200]
  - [-0.250, -0.200]
  - [-0.250,  0.200]

# 600 mm doorway leaves 100 mm per side around the measured 400 mm chassis.
# Keep a small modelling margin; obstacle clearance is handled separately by TEB.
footprint_padding: 0.01

transform_tolerance: 0.5
