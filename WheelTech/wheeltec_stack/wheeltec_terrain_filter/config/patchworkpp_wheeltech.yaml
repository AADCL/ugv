# Measured geometry: base_link is 0.15 m above the floor and the Livox origin
# is another 0.15 m above base_link, so the absolute sensor height is 0.30 m.
sensor_height: 0.30

mode: "czm"
verbose: false
visualize: false
save_flag: false

num_iter: 3
num_lpr: 20
num_min_pts: 8
th_seeds: 0.12
th_dist: 0.08
th_seeds_v: 0.10
th_dist_v: 0.08

min_r: 0.25
max_r: 12.0
uprightness_thr: 0.85
adaptive_seed_selection_margin: -1.2

czm:
  num_zones: 4
  num_sectors_each_zone: [16, 32, 54, 32]
  mum_rings_each_zone: [2, 4, 4, 4]
  elevation_thresholds: [0.0, 0.0, 0.0, 0.0]
  flatness_thresholds: [0.0, 0.0, 0.0, 0.0]

enable_RNR: true
enable_RVPF: true
enable_TGR: true
RNR_ver_angle_thr: -15.0
RNR_intensity_thr: 0.2
