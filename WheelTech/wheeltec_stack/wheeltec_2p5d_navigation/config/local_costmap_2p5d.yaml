global_frame: map
robot_base_frame: base_link
update_frequency: 8.0
publish_frequency: 4.0
transform_tolerance: 0.5
rolling_window: true
width: 6.0
height: 6.0
resolution: 0.05

plugins:
  - {name: terrain_2p5d_layer, type: "wheeltec_2p5d_navigation/TerrainCostmapLayer"}
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

terrain_2p5d_layer:
  enabled: true
  unknown_as_lethal: false

obstacle_layer:
  enabled: true
  footprint_clearing_enabled: true
  observation_sources: terrain_marking terrain_clearing
  terrain_marking:
    topic: /terrain/obstacle_points
    sensor_frame: terrain_sensor
    data_type: PointCloud2
    marking: true
    clearing: false
    min_obstacle_height: 0.08
    max_obstacle_height: 1.50
    obstacle_range: 4.0
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.20
  terrain_clearing:
    topic: /terrain/clearing_points
    sensor_frame: terrain_sensor
    data_type: PointCloud2
    marking: false
    clearing: true
    min_obstacle_height: -0.40
    max_obstacle_height: 2.00
    obstacle_range: 4.0
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.20

inflation_layer:
  inflation_radius: 0.45
  cost_scaling_factor: 4.0

