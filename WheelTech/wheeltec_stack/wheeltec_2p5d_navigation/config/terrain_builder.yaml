resolution: 0.10
padding_m: 0.50
min_points_per_cell: 1
ground_height_percentile: 0.20
max_fill_radius_cells: 4
min_fill_neighbors: 3
fit_radius_m: 0.30
smooth_height_delta_m: 0.12

# 平地和坡道使用同一张连续高程图。坡度只产生软代价；本版本不做楼梯语义。
preferred_slope_deg: 5.0
max_slope_deg: 25.0
max_slope_cost: 80
min_lethal_neighbors: 4

# Static obstacles already come from map.pgm's StaticLayer. Keep this disabled
# so the coarser 2.5D layer contributes slope cost only and does not duplicate
# and enlarge the same obstacles in the global costmap.
fuse_static_obstacles: false

# Used only when fuse_static_obstacles is explicitly enabled.
obstacle_ground_search_radius_m: 0.30
obstacle_min_relative_height_m: 0.08
obstacle_max_relative_height_m: 1.50
