input_cloud: /cloud_registered
input_odom: /Odometry
static_scan_topic: /wheeltec/static_scan
static_map_topic: /wheeltec/static_map_cloud
dynamic_topic: /wheeltec/dynamic_points

# The input is already deskewed and registered by FAST-LIO. These filters only
# affect the exported map; they never feed points back into FAST-LIO.
min_range: 0.50
max_range: 50.0
scan_voxel_size: 0.05

radius_filter:
  enable: true
  radius: 0.15
  min_neighbors: 2

# Coordinates are in the FAST-LIO body frame obtained from /Odometry.
# Measure these limits on the real robot before enabling this filter.
self_filter:
  enable: false
  min_x: -0.30
  max_x: 0.30
  min_y: -0.25
  max_y: 0.25
  min_z: -0.20
  max_z: 0.20

dynamic_filter:
  enable: true
  # 轻量级三维贝叶斯占据栅格：端点命中提高占据概率，穿过体素的
  # 抽样射线降低占据概率，从而清除已经离开的临时障碍。
  # 该状态栅格分辨率独立于最终输出地图分辨率。
  voxel_size: 0.20
  hit_probability: 0.70
  miss_probability: 0.40
  occupied_probability: 0.72
  clearing_probability: 0.35
  min_hit_scans: 8
  min_observation_span: 2.0
  # Jetson NX 每四个滤波点追踪一条射线，并限制清除距离，控制 CPU 开销。
  ray_stride: 4
  max_clearing_range: 20.0
  ray_endpoint_margin: 0.30
  candidate_timeout: 5.0
  cleanup_period: 1.0
  max_voxels: 2000000

# 已确认静态点进入独立的精细栅格，避免动态状态栅格在地面和墙面留下规则孔洞。
map:
  voxel_size: 0.05
  max_voxels: 5000000
  autosave_period: 30.0
  save_on_shutdown: true

map_publish_period: 2.0
publish_dynamic_points: false
max_odom_age: 0.20

# May be overridden by pointcloud_mapper.launch.
output_path: /tmp/filtered_camera_init.pcd
