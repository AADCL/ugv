input_cloud: /cloud_registered
input_odom: /Odometry
static_scan_topic: /wheeltec/static_scan
static_map_topic: /wheeltec/static_map_cloud
dynamic_topic: /wheeltec/dynamic_points

# The input is already deskewed and registered by FAST-LIO. These filters only
# affect the exported map; they never feed points back into FAST-LIO.
min_range: 0.50
max_range: 50.0
scan_voxel_size: 0.05

radius_filter:
  enable: true
  radius: 0.15
  min_neighbors: 2

# Coordinates are in the FAST-LIO body frame obtained from /Odometry.
# Measure these limits on the real robot before enabling this filter.
self_filter:
  enable: false
  min_x: -0.30
  max_x: 0.30
  min_y: -0.25
  max_y: 0.25
  min_z: -0.20
  max_z: 0.20

dynamic_filter:
  enable: true
  # This is the only dynamic/static authority. Candidate voxels are never
  # exported until they have enough persistent, positive observations.
  voxel_size: 0.20
  hit_probability: 0.65
  miss_probability: 0.30
  occupied_probability: 0.75
  clearing_probability: 0.35
  min_hit_scans: 25
  min_observation_span: 4.0
  min_hit_ratio: 0.70
  # Exact 3D voxel traversal is used for each selected ray. Start at stride 2
  # on Jetson NX; bag replay must verify callback time before reducing to 1.
  ray_stride: 2
  max_clearing_range: 20.0
  ray_endpoint_margin: 0.20
  candidate_timeout: 3.0
  cleanup_period: 1.0
  max_voxels: 2000000

# Fine samples remain tied to a Bayesian generation. Demotion invalidates the
# complete generation so stale geometry cannot reappear after later hits.
map:
  voxel_size: 0.05
  max_voxels: 5000000
  autosave_period: 30.0
  save_on_shutdown: true

map_publish_period: 2.0
# Keep enabled during validation. It can be disabled after the dynamic-object
# acceptance test passes on the target Jetson.
publish_dynamic_points: true
max_odom_age: 0.20

# May be overridden by pointcloud_mapper.launch.
output_path: /tmp/filtered_camera_init.pcd
